[package]
name = "piphone"
version = "1.4.4"
authors = ["Steffen Manzer"]
edition = "2021"
rust-version = "1.91"
description = "Headless SIP telephone inside a historical rotary dial phone (Raspberry Pi Zero 2W)"
license = "MIT"

[[bin]]
name = "piphone"
path = "src/main.rs"

[lib]
name = "piphone"
path = "src/lib.rs"

[features]
# The hardware test tools in `examples/`. Off by default so that `cargo test`
# does not build nine extra binaries: on the Pi the linker is the memory peak,
# and AGENTS.md requires the tests to be linked serially for exactly that
# reason. Run them with `--features harness`, e.g.
# `cargo run --features harness --example hardware-dial`.
harness = []

[dependencies]
# Async runtime - also required by rvoip
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "process",
    "fs",
] }

# SIP stack - replaces linphonec
rvoip = "0.3.12"

# Web interface
axum = "0.8"

# Configuration and JSON
toml = "1"
# `preserve_order` keeps JSON object keys in insertion order, which the web
# interface relies on to list validation errors in schema order.
serde_json = { version = "1", features = ["preserve_order"] }

# Schema pattern matching (config.rs), TOML key formatting
regex = "1"

# Local time, weekday, next wake-up calculation
chrono = { version = "0.4", features = ["clock"] }

# Randomised sleep-music order
rand = "0.9"

# Decoding the ringtones and tones in `sounds/`. Only the WAV and MP3 features are
# enabled, because those are the only formats in use. `pcm` is the decoder for
# plain WAV, and without it every WAV file fails with "unsupported audio codec".
# `opt-simd-neon` matters: the Pi Zero 2W is an ARM Cortex-A53, which has NEON.
symphonia = { version = "0.6", default-features = false, features = [
    "wav",
    "mp3",
    "pcm",
    "id3v2",
    "opt-simd-neon",
] }

# HTTP Basic Auth decoding
base64 = "0.23"

# `flock` for the lock file that keeps a second instance off the hardware.
libc = "0.2"

# Hardware. Both crates are Linux-only and need the corresponding system
# libraries, which Raspberry Pi OS provides (libgpiod 2.x, libasound2).
[target.'cfg(target_os = "linux")'.dependencies]

# Rotary dial, hook switch and LEDs via the GPIO character device. `v2` is the
# default, but named explicitly: it is what links against libgpiod 2.x, and the
# edge events the dial runs on only exist there.
gpiod = { version = "0.3", default-features = false, features = ["v2"] }

# Call audio via the USB sound card (earpiece + microphone)
alsa = "0.12"

[dev-dependencies]
tempfile = "3"
# Drives the axum router in-process, so the HTTP tests need no port and no
# external client.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The hardware test tools. See the `harness` feature above for why they are
# listed one by one rather than picked up automatically.
[[example]]
name = "audio-probe"
required-features = ["harness"]

[[example]]
name = "decode-probe"
required-features = ["harness"]

[[example]]
name = "gpio-probe"
required-features = ["harness"]

[[example]]
name = "hardware-audio"
required-features = ["harness"]

[[example]]
name = "hardware-connections"
required-features = ["harness"]

[[example]]
name = "hardware-dial"
required-features = ["harness"]

[[example]]
name = "incoming-probe"
required-features = ["harness"]

[[example]]
name = "playback-probe"
required-features = ["harness"]

[[example]]
name = "render-page"
required-features = ["harness"]

# https://github.com/johnthagen/min-sized-rust
[profile.release]
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
strip = true        # Strip symbols from binary
